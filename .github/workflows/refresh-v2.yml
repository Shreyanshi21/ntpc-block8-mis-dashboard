name: Refresh v2 dashboard from VisiLean

# WHY THIS IS A LOOP AND NOT A "*/5" CRON
# GitHub only runs `schedule` events on a best-effort basis and throttles them hard.
# Measured on this repo over 23-24 Aug 2026 with cron "*/5": actual gaps were
# median 27 min, max 111 min - never once 5 minutes. That is why the dashboard was
# showing hour-old data while VisiLean was current.
# So: the schedule only has to START a run, and the run itself then refreshes every
# 5 minutes for just under 6 hours (the GitHub job ceiling). The 2-hourly trigger
# plus cancel-in-progress means a fresh worker always takes over, and a skipped or
# badly delayed trigger is still covered by the previous run's remaining hours.

on:
  schedule:
    # GitHub fires scheduled runs on a best-effort basis and drops most of them:
    # asking every 2 hours produced actual triggers ~11 hours apart (26-Aug 23:26,
    # 27-Aug 09:35, 27-Aug 20:21), leaving ~5h dead once a worker's window ended.
    # Asking every 30 minutes gets far more of them through; concurrency means a new
    # worker simply replaces the running one, so extra triggers cost nothing.
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      once:
        description: "Refresh once and exit (no loop)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: refresh-v2
  cancel-in-progress: true      # a newly started worker replaces the running one

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 350        # stay under the 6h hard limit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Resolve credentials. One VL_TOKENS_JSON secret can carry every project's tokens;
      # per-project secrets still win. Not configured = warning + skipped loop, never a
      # failed run - see scripts/sync_preflight.py.
      - name: Resolve VisiLean credentials
        id: pre
        env:
          VL_TOKENS_JSON: ${{ secrets.VL_TOKENS_JSON }}
          VL_TOKEN_TASK: ${{ secrets.VL_TOKEN_TASK }}
          VL_TOKEN_HISTORY: ${{ secrets.VL_TOKEN_HISTORY }}
          VL_TOKEN_CONSTRAINTS: ${{ secrets.VL_TOKEN_CONSTRAINTS }}
        run: python scripts/sync_preflight.py ntpc

      - name: Refresh loop (every 5 minutes)
        if: steps.pre.outputs.configured == 'true'
        env:
          VL_TOKENS_JSON: ${{ secrets.VL_TOKENS_JSON }}
          VL_TOKEN_TASK: ${{ secrets.VL_TOKEN_TASK }}
          VL_TOKEN_HISTORY: ${{ secrets.VL_TOKEN_HISTORY }}
          VL_TOKEN_CONSTRAINTS: ${{ secrets.VL_TOKEN_CONSTRAINTS }}
          ONCE: ${{ inputs.once }}
        run: |
          set -uo pipefail
          git config user.name  "visilean-bot"
          git config user.email "support@visilean.com"

          END=$(( $(date +%s) + 340*60 ))   # leave headroom before the job timeout
          n=0
          fails=0
          while : ; do
            n=$((n+1))
            echo "::group::cycle $n  $(date -u '+%H:%M:%S UTC')"

            if python scripts/ntpc_dash_data_v2.py && python scripts/build_ntpc_dash_v2.py && python scripts/build_ntpc_dash_v3.py ; then
              fails=0
              if git diff --quiet -- v2/.datahash v2/.tplhash ; then
                echo "no data change"
              else
                git add v2 v3          # this workflow builds BOTH NTPC themes
                git commit -m "v2 auto-refresh $(TZ=Asia/Kolkata date '+%d-%b %H:%M IST')" || true
                # another worker may have pushed while we were building
                for try in 1 2 3 ; do
                  git pull --rebase --autostash -q && git push -q && { echo "published"; break; }
                  echo "push retry $try"; sleep 5
                done
              fi
            else
              # a bad cycle must not kill the worker - the next one recovers. But a run
              # of them means the sync is broken, not that VisiLean blinked, so stop
              # pretending everything is fine and let the run go red.
              fails=$((fails+1))
              echo "cycle failed (VisiLean unreachable or build error) - continuing ($fails in a row)"
              git checkout -- v2 v3 2>/dev/null || true
              if [ "$fails" -ge 6 ]; then
                echo "::error title=NTPC Bikaner Block 8 sync is failing::$fails cycles in a row failed - VisiLean unreachable, token rejected, or a build error."
                echo "### NTPC Bikaner Block 8 sync is failing" >> "$GITHUB_STEP_SUMMARY"
                echo "" >> "$GITHUB_STEP_SUMMARY"
                echo "$fails consecutive cycles failed (~$((fails*5)) minutes). Check the cycle logs above: a rejected token gives HTTP 400 from VisiLean." >> "$GITHUB_STEP_SUMMARY"
                exit 1
              fi
            fi
            echo "::endgroup::"

            if [ "${ONCE:-false}" = "true" ]; then echo "once-mode: done"; break; fi
            if [ "$(date +%s)" -ge "$END" ]; then echo "worker window finished after $n cycles"; break; fi
            sleep 300
          done

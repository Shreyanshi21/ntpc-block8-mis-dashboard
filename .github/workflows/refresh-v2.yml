name: Refresh v2 dashboard from VisiLean

# Runs twice a day (10:00 and 16:00 IST) and whenever someone presses "Run workflow"
# in the Actions tab. Each run is ONE refresh: fetch VisiLean, rebuild v2 + v3, commit
# and push only if the data or the template changed.
#
# GitHub fires scheduled runs on a best-effort basis, so a 10:00 run may actually
# start a little later (measured delays on this repo: typically 10-30 min, worst case
# ~2 h). Press "Run workflow" if you need the numbers right now.

on:
  schedule:
    # cron is UTC. IST = UTC+5:30, so 10:00 IST = 04:30 UTC and 16:00 IST = 10:30 UTC.
    - cron: "30 4 * * *"      # 10:00 IST
    - cron: "30 10 * * *"     # 16:00 IST
  workflow_dispatch:          # manual: Actions tab -> "Run workflow", or `gh workflow run refresh-v2.yml`

permissions:
  contents: write

concurrency:
  group: refresh-v2
  cancel-in-progress: true      # a manual run started during a scheduled one replaces it

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Resolve credentials. VisiLean issues one token per project: VL_TOKEN_<KEY> is
      # tried first, then the project's entry in the single VL_TOKENS_JSON secret. Not
      # configured = warning + skipped refresh, never a failed run - see scripts/sync_preflight.py.
      - name: Resolve VisiLean credentials
        id: pre
        env:
          VL_TOKENS_JSON: ${{ secrets.VL_TOKENS_JSON }}
          VL_TOKEN_NTPC: ${{ secrets.VL_TOKEN_NTPC }}
        run: python scripts/sync_preflight.py ntpc

      - name: Refresh once (fetch, build, publish if changed)
        if: steps.pre.outputs.configured == 'true'
        env:
          VL_TOKENS_JSON: ${{ secrets.VL_TOKENS_JSON }}
          VL_TOKEN_NTPC: ${{ secrets.VL_TOKEN_NTPC }}
        run: |
          set -uo pipefail
          git config user.name  "visilean-bot"
          git config user.email "support@visilean.com"

          # VisiLean occasionally blinks; give it three tries two minutes apart before
          # calling the run failed.
          built=false
          for attempt in 1 2 3 ; do
            echo "::group::attempt $attempt  $(date -u '+%H:%M:%S UTC')"
            if python scripts/ntpc_dash_data_v2.py && python scripts/build_ntpc_dash_v2.py && python scripts/build_ntpc_dash_v3.py ; then
              built=true
              echo "::endgroup::"
              break
            fi
            echo "attempt $attempt failed (VisiLean unreachable or build error)"
            echo "::endgroup::"
            git checkout -- v2 v3 2>/dev/null || true
            [ "$attempt" -lt 3 ] && sleep 120
          done

          if [ "$built" != "true" ]; then
            echo "::error title=NTPC Bikaner Block 8 refresh failed::3 attempts failed - VisiLean unreachable, token rejected, or a build error."
            echo "### NTPC Bikaner Block 8 refresh failed" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "All 3 attempts failed. Check the logs above: a rejected token gives HTTP 400 from VisiLean." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if git diff --quiet -- v2/.datahash v2/.tplhash ; then
            echo "no data change - nothing published"
            echo "No change in VisiLean data since the last build; nothing published." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git add v2 v3          # this workflow builds BOTH NTPC themes
          git commit -m "v2 auto-refresh $(TZ=Asia/Kolkata date '+%d-%b %H:%M IST')" || true
          # someone may have pushed while we were building
          for try in 1 2 3 ; do
            git pull --rebase --autostash -q && git push -q && { echo "published"; echo "Published a new build at $(TZ=Asia/Kolkata date '+%d-%b %H:%M IST')." >> "$GITHUB_STEP_SUMMARY"; exit 0; }
            echo "push retry $try"; sleep 5
          done
          echo "::error::could not push after 3 tries"
          exit 1

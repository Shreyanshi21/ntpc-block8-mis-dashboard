name: Refresh Adani S6a dashboard from VisiLean

# Adani Green Energy S6a (234 MW). This project had a config and a published folder but
# no workflow, so it was the one dashboard that could ONLY be built by hand on someone's
# laptop. Same worker pattern as refresh-v2.yml (see the comments there): GitHub drops
# most scheduled events, so the schedule only has to START a run and the run itself then
# refreshes every 5 minutes for just under 6 hours.

on:
  schedule:
    - cron: "17,47 * * * *"      # offset from the other projects so they do not pile up
  workflow_dispatch:
    inputs:
      once:
        description: "Refresh once and exit (no loop)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: refresh-adani
  cancel-in-progress: true      # a newly started worker replaces the running one

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 350        # stay under the 6h hard limit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Fail LOUDLY when the sync is not configured. Without this the loop below just
      # logs "cycle failed" every 5 minutes and the run still finishes green, which is
      # how four dashboards sat stale for days with nothing to show for it.
      - name: Check credentials are configured
        env:
          T: ${{ secrets.VL_TOKEN_TASK_ADANI }}
          H: ${{ secrets.VL_TOKEN_HISTORY_ADANI }}
          C: ${{ secrets.VL_TOKEN_CONSTRAINTS_ADANI }}
        run: |
          missing=""
          [ -n "${T:-}" ] || missing="$missing VL_TOKEN_TASK_ADANI"
          [ -n "${H:-}" ] || missing="$missing VL_TOKEN_HISTORY_ADANI"
          [ -n "${C:-}" ] || missing="$missing VL_TOKEN_CONSTRAINTS_ADANI"
          if [ -n "$missing" ]; then
            echo "::error title=Adani S6a sync is not configured::Missing repository secret(s):$missing"
            {
              echo "### Adani S6a sync is not configured"
              echo ""
              echo "Missing repository secret(s):"
              for s in $missing ; do echo "- \`$s\`" ; done
              echo ""
              echo "A VisiLean API token only works for the project it was generated for, so this"
              echo "project needs its own. Add them once and this dashboard refreshes itself:"
              echo ""
              echo '```bash'
              for s in $missing ; do echo "gh secret set $s --repo ${{ github.repository }}" ; done
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "credentials present"

      - name: Refresh loop (every 5 minutes)
        env:
          VL_TOKEN_TASK_ADANI: ${{ secrets.VL_TOKEN_TASK_ADANI }}
          VL_TOKEN_HISTORY_ADANI: ${{ secrets.VL_TOKEN_HISTORY_ADANI }}
          VL_TOKEN_CONSTRAINTS_ADANI: ${{ secrets.VL_TOKEN_CONSTRAINTS_ADANI }}
          ONCE: ${{ inputs.once }}
        run: |
          set -uo pipefail
          git config user.name  "visilean-bot"
          git config user.email "support@visilean.com"

          END=$(( $(date +%s) + 340*60 ))   # leave headroom before the job timeout
          n=0
          fails=0
          while : ; do
            n=$((n+1))
            echo "::group::cycle $n  $(date -u '+%H:%M:%S UTC')"

            if python scripts/dash_data.py adani && python scripts/build_dash.py adani ; then
              fails=0
              if git diff --quiet -- adani/.datahash adani/.tplhash ; then
                echo "no data change"
              else
                git add adani
                git commit -m "adani auto-refresh $(TZ=Asia/Kolkata date '+%d-%b %H:%M IST')" || true
                for try in 1 2 3 ; do
                  git pull --rebase --autostash -q && git push -q && { echo "published"; break; }
                  echo "push retry $try"; sleep 5
                done
              fi
            else
              # a bad cycle must not kill the worker - the next one recovers. But a run
              # of them means the sync is broken, not that VisiLean blinked, so stop
              # pretending everything is fine and let the run go red.
              fails=$((fails+1))
              echo "cycle failed (VisiLean unreachable or build error) - continuing ($fails in a row)"
              git checkout -- adani 2>/dev/null || true
              if [ "$fails" -ge 6 ]; then
                echo "::error title=Adani S6a sync is failing::$fails cycles in a row failed - VisiLean unreachable, token rejected, or a build error."
                echo "### Adani S6a sync is failing" >> "$GITHUB_STEP_SUMMARY"
                echo "" >> "$GITHUB_STEP_SUMMARY"
                echo "$fails consecutive cycles failed (~$((fails*5)) minutes). Check the cycle logs above: a rejected token gives HTTP 400 from VisiLean." >> "$GITHUB_STEP_SUMMARY"
                exit 1
              fi
            fi
            echo "::endgroup::"

            if [ "${ONCE:-false}" = "true" ]; then echo "once-mode: done"; break; fi
            if [ "$(date +%s)" -ge "$END" ]; then echo "worker window finished after $n cycles"; break; fi
            sleep 300
          done

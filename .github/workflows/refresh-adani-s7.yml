name: Refresh Adani S7 dashboard from VisiLean

# Same worker pattern as refresh-v2.yml (see the comments there): GitHub drops most
# scheduled events, so the schedule only has to START a run and the run itself then
# refreshes every 5 minutes for just under 6 hours.

on:
  schedule:
    - cron: "22,52 * * * *"
  workflow_dispatch:
    inputs:
      once:
        description: "Refresh once and exit (no loop)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: refresh-adanis7
  cancel-in-progress: true      # a newly started worker replaces the running one

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 350        # stay under the 6h hard limit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Resolve credentials. VisiLean issues one token per project: VL_TOKEN_<KEY> is
      # tried first, then the project's entry in the single VL_TOKENS_JSON secret. Not
      # configured = warning + skipped loop, never a failed run - see scripts/sync_preflight.py.
      - name: Resolve VisiLean credentials
        id: pre
        env:
          VL_TOKENS_JSON: ${{ secrets.VL_TOKENS_JSON }}
          VL_TOKEN_ADANIS7: ${{ secrets.VL_TOKEN_ADANIS7 }}
        run: python scripts/sync_preflight.py adanis7

      - name: Refresh loop (every 5 minutes)
        if: steps.pre.outputs.configured == 'true'
        env:
          VL_TOKENS_JSON: ${{ secrets.VL_TOKENS_JSON }}
          VL_TOKEN_ADANIS7: ${{ secrets.VL_TOKEN_ADANIS7 }}
          ONCE: ${{ inputs.once }}
        run: |
          set -uo pipefail
          git config user.name  "visilean-bot"
          git config user.email "support@visilean.com"

          END=$(( $(date +%s) + 340*60 ))   # leave headroom before the job timeout
          n=0
          fails=0
          while : ; do
            n=$((n+1))
            echo "::group::cycle $n  $(date -u '+%H:%M:%S UTC')"

            if python scripts/dash_data.py adanis7 && python scripts/build_dash.py adanis7 ; then
              fails=0
              if git diff --quiet -- adani-s7/.datahash adani-s7/.tplhash ; then
                echo "no data change"
              else
                git add adani-s7
                git commit -m "adanis7 auto-refresh $(TZ=Asia/Kolkata date '+%d-%b %H:%M IST')" || true
                # another worker may have pushed while we were building
                for try in 1 2 3 ; do
                  git pull --rebase --autostash -q && git push -q && { echo "published"; break; }
                  echo "push retry $try"; sleep 5
                done
              fi
            else
              # a bad cycle must not kill the worker - the next one recovers. But a run
              # of them means the sync is broken, not that VisiLean blinked, so stop
              # pretending everything is fine and let the run go red.
              fails=$((fails+1))
              echo "cycle failed (VisiLean unreachable or build error) - continuing ($fails in a row)"
              git checkout -- adani-s7 2>/dev/null || true
              if [ "$fails" -ge 6 ]; then
                echo "::error title=Adani S7 sync is failing::$fails cycles in a row failed - VisiLean unreachable, token rejected, or a build error."
                echo "### Adani S7 sync is failing" >> "$GITHUB_STEP_SUMMARY"
                echo "" >> "$GITHUB_STEP_SUMMARY"
                echo "$fails consecutive cycles failed (~$((fails*5)) minutes). Check the cycle logs above: a rejected token gives HTTP 400 from VisiLean." >> "$GITHUB_STEP_SUMMARY"
                exit 1
              fi
            fi
            echo "::endgroup::"

            if [ "${ONCE:-false}" = "true" ]; then echo "once-mode: done"; break; fi
            if [ "$(date +%s)" -ge "$END" ]; then echo "worker window finished after $n cycles"; break; fi
            sleep 300
          done

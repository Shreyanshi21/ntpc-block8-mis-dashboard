name: Refresh NTPC user adoption + updates reports from VisiLean

# Same worker pattern as refresh-v2.yml (see the comments there): GitHub drops most
# scheduled events, so the schedule only has to START a run and the run itself then
# refreshes for just under 6 hours.
#
# The audit trail moves far more slowly than the schedule data (a few hundred events a
# week, not thousands a day), so this worker cycles every 15 minutes rather than 5.

on:
  schedule:
    - cron: "22,52 * * * *"
  workflow_dispatch:
    inputs:
      once:
        description: "Refresh once and exit (no loop)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: refresh-adoption
  cancel-in-progress: true      # a newly started worker replaces the running one

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 350        # stay under the 6h hard limit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Fail LOUDLY when the sync is not configured. Without this the loop below just
      # logs "cycle failed" every 5 minutes and the run still finishes green, which is
      # how four dashboards sat stale for days with nothing to show for it.
      - name: Check credentials are configured
        env:
          T: ${{ secrets.VL_TOKEN_ADOPT_TASK }}
          H: ${{ secrets.VL_TOKEN_ADOPT_HIST }}
          C: ${{ secrets.VL_TOKEN_ADOPT_NOTES }}
        run: |
          missing=""
          [ -n "${T:-}" ] || missing="$missing VL_TOKEN_ADOPT_TASK"
          [ -n "${H:-}" ] || missing="$missing VL_TOKEN_ADOPT_HIST"
          [ -n "${C:-}" ] || missing="$missing VL_TOKEN_ADOPT_NOTES"
          if [ -n "$missing" ]; then
            echo "::error title=Adoption tracker sync is not configured::Missing repository secret(s):$missing"
            {
              echo "### Adoption tracker sync is not configured"
              echo ""
              echo "Missing repository secret(s):"
              for s in $missing ; do echo "- \`$s\`" ; done
              echo ""
              echo "A VisiLean API token only works for the project it was generated for, so this"
              echo "project needs its own. Add them once and this dashboard refreshes itself:"
              echo ""
              echo '```bash'
              for s in $missing ; do echo "gh secret set $s --repo ${{ github.repository }}" ; done
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "credentials present"

      - name: Refresh loop (every 15 minutes)
        env:
          VL_TOKEN_ADOPT_TASK: ${{ secrets.VL_TOKEN_ADOPT_TASK }}
          VL_TOKEN_ADOPT_HIST: ${{ secrets.VL_TOKEN_ADOPT_HIST }}
          VL_TOKEN_ADOPT_NOTES: ${{ secrets.VL_TOKEN_ADOPT_NOTES }}
          ONCE: ${{ inputs.once }}
        run: |
          set -uo pipefail
          git config user.name  "visilean-bot"
          git config user.email "support@visilean.com"

          END=$(( $(date +%s) + 330*60 ))   # leave headroom before the job timeout
          n=0
          fails=0
          while : ; do
            n=$((n+1))
            echo "::group::cycle $n  $(date -u '+%H:%M:%S UTC')"

            if python scripts/adoption_data.py && python scripts/build_adoption.py && python scripts/build_updates.py ; then
              fails=0
              if git diff --quiet -- adoption/.datahash adoption/.tplhash ; then
                echo "no new activity in the trail"
              else
                git add adoption
                        updates/index.html updates/meta.json updates/.datahash
                git commit -m "adoption + updates auto-refresh $(TZ=Asia/Kolkata date '+%d-%b %H:%M IST')" || true
                # another worker may have pushed while we were building
                for try in 1 2 3 ; do
                  git pull --rebase --autostash -q && git push -q && { echo "published"; break; }
                  echo "push retry $try"; sleep 5
                done
              fi
            else
              # a bad cycle must not kill the worker - the next one recovers. But a run
              # of them means the sync is broken, not that VisiLean blinked, so stop
              # pretending everything is fine and let the run go red.
              fails=$((fails+1))
              echo "cycle failed (VisiLean unreachable or build error) - continuing ($fails in a row)"
              git checkout -- adoption updates 2>/dev/null || true
              if [ "$fails" -ge 6 ]; then
                echo "::error title=Adoption tracker sync is failing::$fails cycles in a row failed - VisiLean unreachable, token rejected, or a build error."
                echo "### Adoption tracker sync is failing" >> "$GITHUB_STEP_SUMMARY"
                echo "" >> "$GITHUB_STEP_SUMMARY"
                echo "$fails consecutive cycles failed (~$((fails*5)) minutes). Check the cycle logs above: a rejected token gives HTTP 400 from VisiLean." >> "$GITHUB_STEP_SUMMARY"
                exit 1
              fi
            fi
            echo "::endgroup::"

            if [ "${ONCE:-false}" = "true" ]; then echo "once-mode: done"; break; fi
            if [ "$(date +%s)" -ge "$END" ]; then echo "worker window finished after $n cycles"; break; fi
            sleep 900
          done

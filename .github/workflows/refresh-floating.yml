name: Refresh Floating Solar dashboard from VisiLean

# Same worker pattern as refresh-v2.yml (see the comments there): GitHub drops most
# scheduled events, so the schedule only has to START a run and the run itself then
# refreshes every 5 minutes for just under 6 hours.

on:
  schedule:
    - cron: "13,43 * * * *"
  workflow_dispatch:
    inputs:
      once:
        description: "Refresh once and exit (no loop)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: refresh-floating
  cancel-in-progress: true      # a newly started worker replaces the running one

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 350        # stay under the 6h hard limit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Fail LOUDLY when the sync is not configured. Without this the loop below just
      # logs "cycle failed" every 5 minutes and the run still finishes green, which is
      # how four dashboards sat stale for days with nothing to show for it.
      - name: Check credentials are configured
        env:
          T: ${{ secrets.VL_TOKEN_TASK_FLOATING }}
          H: ${{ secrets.VL_TOKEN_HISTORY_FLOATING }}
          C: ${{ secrets.VL_TOKEN_CONSTRAINTS_FLOATING }}
        run: |
          missing=""
          [ -n "${T:-}" ] || missing="$missing VL_TOKEN_TASK_FLOATING"
          [ -n "${H:-}" ] || missing="$missing VL_TOKEN_HISTORY_FLOATING"
          [ -n "${C:-}" ] || missing="$missing VL_TOKEN_CONSTRAINTS_FLOATING"
          if [ -n "$missing" ]; then
            echo "::error title=Floating Solar sync is not configured::Missing repository secret(s):$missing"
            {
              echo "### Floating Solar sync is not configured"
              echo ""
              echo "Missing repository secret(s):"
              for s in $missing ; do echo "- \`$s\`" ; done
              echo ""
              echo "A VisiLean API token only works for the project it was generated for, so this"
              echo "project needs its own. Add them once and this dashboard refreshes itself:"
              echo ""
              echo '```bash'
              for s in $missing ; do echo "gh secret set $s --repo ${{ github.repository }}" ; done
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "credentials present"

      - name: Refresh loop (every 5 minutes)
        env:
          # per-project tokens; the builder also accepts the plain VL_TOKEN_* names
          VL_TOKEN_TASK_FLOATING: ${{ secrets.VL_TOKEN_TASK_FLOATING }}
          VL_TOKEN_HISTORY_FLOATING: ${{ secrets.VL_TOKEN_HISTORY_FLOATING }}
          VL_TOKEN_CONSTRAINTS_FLOATING: ${{ secrets.VL_TOKEN_CONSTRAINTS_FLOATING }}
          ONCE: ${{ inputs.once }}
        run: |
          set -uo pipefail
          git config user.name  "visilean-bot"
          git config user.email "support@visilean.com"

          END=$(( $(date +%s) + 340*60 ))   # leave headroom before the job timeout
          n=0
          fails=0
          while : ; do
            n=$((n+1))
            echo "::group::cycle $n  $(date -u '+%H:%M:%S UTC')"

            if python scripts/dash_data.py floating && python scripts/build_dash.py floating ; then
              fails=0
              if git diff --quiet -- floating/.datahash floating/.tplhash ; then
                echo "no data change"
              else
                git add floating
                git commit -m "floating auto-refresh $(TZ=Asia/Kolkata date '+%d-%b %H:%M IST')" || true
                # another worker may have pushed while we were building
                for try in 1 2 3 ; do
                  git pull --rebase --autostash -q && git push -q && { echo "published"; break; }
                  echo "push retry $try"; sleep 5
                done
              fi
            else
              # a bad cycle must not kill the worker - the next one recovers. But a run
              # of them means the sync is broken, not that VisiLean blinked, so stop
              # pretending everything is fine and let the run go red.
              fails=$((fails+1))
              echo "cycle failed (VisiLean unreachable or build error) - continuing ($fails in a row)"
              git checkout -- floating 2>/dev/null || true
              if [ "$fails" -ge 6 ]; then
                echo "::error title=Floating Solar sync is failing::$fails cycles in a row failed - VisiLean unreachable, token rejected, or a build error."
                echo "### Floating Solar sync is failing" >> "$GITHUB_STEP_SUMMARY"
                echo "" >> "$GITHUB_STEP_SUMMARY"
                echo "$fails consecutive cycles failed (~$((fails*5)) minutes). Check the cycle logs above: a rejected token gives HTTP 400 from VisiLean." >> "$GITHUB_STEP_SUMMARY"
                exit 1
              fi
            fi
            echo "::endgroup::"

            if [ "${ONCE:-false}" = "true" ]; then echo "once-mode: done"; break; fi
            if [ "$(date +%s)" -ge "$END" ]; then echo "worker window finished after $n cycles"; break; fi
            sleep 300
          done
